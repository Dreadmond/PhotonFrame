; PlatformIO Project Configuration File
; PhotonFrame - Indoor Solar E-Paper Display with INA228 Power Monitoring
; Board: DFRobot FireBeetle ESP32-E

[env:firebeetle32]
platform = espressif32
; Use esp32dev (4MB flash) instead of firebeetle32 (16MB flash)
board = esp32dev
framework = arduino
monitor_speed = 115200

; Partition for 4MB flash - no OTA partition, max app space (~2MB)
; WARNING: OTA updates overwrite the running firmware with no rollback.
; Power loss mid-flash = brick. Consider min_spiffs.csv for dual-app OTA safety.
board_build.partitions = no_ota.csv

; Build flags for optimization
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os
    -DNDEBUG
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -DARDUINOJSON_ENABLE_STD_STRING=0
    -DARDUINOJSON_ENABLE_STD_STREAM=0

; LittleFS for image caching (avoids RAM fragmentation)
board_build.filesystem = littlefs

; Library dependencies
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    zinggjm/GxEPD2@^1.5.0
    kikuchan98/pngle@^1.0.0
    tzapu/WiFiManager@^2.0.17

; Upload settings
upload_speed = 115200

; Monitor filters for readable output
monitor_filters =
    esp32_exception_decoder
    time
